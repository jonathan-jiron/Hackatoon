services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ctt
    ports:
      - "54322:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Local-only shim for Supabase roles/schemas, then the real migrations in order.
      - ./supabase/local-init.sql:/docker-entrypoint-initdb.d/00-local-init.sql:ro
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./supabase/run-migrations.sh:/docker-entrypoint-initdb.d/10-run-migrations.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ctt"]
      interval: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Guayaquil
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      # Workflows read secrets from env instead of storing them in n8n credentials.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      AGENT_API_KEY: ${AGENT_API_KEY}
      OPERATOR_SEND_KEY: ${OPERATOR_SEND_KEY}
      AGENT_URL: ${AGENT_URL:-http://host.docker.internal:3001}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

volumes:
  db_data:
  n8n_data:
